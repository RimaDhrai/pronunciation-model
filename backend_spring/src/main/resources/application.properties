spring.application.name=prononciationtest

# Force UTF-8 encoding on all HTTP responses
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true
spring.jackson.default-property-inclusion=non_null

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pronunciation_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456789}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update

spring.flyway.enabled=false

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
logging.level.org.springframework.security=DEBUG
python.base-url=http://localhost:8000

ollama.base-url=http://localhost:11434
# qwen2.5:7b pour génération qualitative (exercices, feedback, test CEFR)
ollama.model=qwen2.5:3b
# qwen2.5:3b pour chatbot temps-réel (~2 Go VRAM, ~3x plus rapide que 7b sur RTX 2050)
# Si non installé : ollama pull qwen2.5:3b
ollama.model.chatbot=qwen2.5:3b

# Azure OpenAI (override Ollama when enabled=true)
azure.openai.enabled=${AZURE_OPENAI_ENABLED:false}
azure.openai.endpoint=${AZURE_OPENAI_ENDPOINT:}
azure.openai.key=${AZURE_OPENAI_KEY:}
azure.openai.deployment=${AZURE_OPENAI_DEPLOYMENT:gpt-4.1-mini}

# Activer les metriques
management.endpoints.web.exposure.include=health,metrics
management.metrics.export.simple.enabled=true

app.storage.audio-dir=./storage/audio

jwt.secret-base64=${JWT_SECRET:eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJyaW1hQGRoLmNvbSIsImlhdCI6MTc3MjUzNTEwOCwiZXhwIjoxNzcyNjIxNTA4fQ.1erQkDDLgx7Ezzaz6Lzr138ck5uXQrmVbNN4V59wP9A}

# Taille max upload (videos de cours peuvent etre volumineuses)
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

spring.jackson.serialization.write-dates-as-timestamps=false
app.storage.video-dir=./storage/videos
app.storage.image-dir=./storage/images

# Keycloak / OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8090/realms/talan

# Keycloak Admin API (pour creer des comptes via /auth/register)
keycloak.admin.url=http://localhost:8090
keycloak.admin.realm=talan
keycloak.admin.client-id=talan-frontend
keycloak.admin.master-realm=master
keycloak.admin.username=${KEYCLOAK_ADMIN_USERNAME:admin}
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD:Admin1234!}

# URL du frontend (utilisee pour redirect apres reset mot de passe Keycloak)
app.frontend.url=http://localhost:8081

