# ── SonarQube — Projet SpeakCoach (Fullstack) ───────────────────────────────
# Utilisé par sonar-scanner (frontend + Python)
# Le backend Spring Boot utilise mvn sonar:sonar (voir Jenkinsfile)

sonar.projectKey=speakcoach-fullstack
sonar.projectName=SpeakCoach FullStack
sonar.projectVersion=1.0

# ── Sources ──────────────────────────────────────────────────────────────────
sonar.sources=frontend/src,mon_projettalan_fastapi

# ── Exclusions ───────────────────────────────────────────────────────────────
sonar.exclusions=\
  **/node_modules/**,\
  **/__pycache__/**,\
  **/.venv/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/*.min.js,\
  **/public/**

# ── Tests ────────────────────────────────────────────────────────────────────
sonar.tests=frontend/src/test,mon_projettalan_fastapi/tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/test_*.py,**/*_test.py

# ── Couverture Frontend (lcov généré par vitest) ─────────────────────────────
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# ── Couverture Python (xml généré par pytest-cov) ────────────────────────────
sonar.python.coverage.reportPaths=mon_projettalan_fastapi/coverage.xml
sonar.python.version=3.11

# ── TypeScript / JavaScript ───────────────────────────────────────────────────
sonar.typescript.tsconfigPaths=frontend/tsconfig.json

# ── Encodage ─────────────────────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8
