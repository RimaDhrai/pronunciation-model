name: CI SpeakCoach

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:

  spring-boot:
    name: Spring Boot - Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pronunciation_db_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build skip tests
        working-directory: backend_spring
        run: ./mvnw clean package -DskipTests -q

      - name: Run tests and JaCoCo
        working-directory: backend_spring
        env:
          DB_URL: jdbc:postgresql://localhost:5432/pronunciation_db_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          KEYCLOAK_ADMIN_PASSWORD: Admin1234!
          JWT_SECRET: dGVzdC1zZWNyZXQtZm9yLWdpdGh1Yi1hY3Rpb25z
          MAIL_USERNAME: test@test.com
          MAIL_PASSWORD: test
        run: ./mvnw test jacoco:report -q

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: backend_spring/target/site/jacoco/

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Spring Boot Tests
          path: backend_spring/target/surefire-reports/*.xml
          reporter: java-junit

  frontend:
    name: Frontend - Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Tests and coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/

  fastapi:
    name: FastAPI - Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: fastapi/requirements.txt

      - name: Install dependencies
        working-directory: fastapi
        run: |
          pip install --upgrade pip -q
          pip install -r requirements.txt -q
          pip install pytest pytest-cov -q

      - name: Run tests
        working-directory: fastapi
        run: |
          pytest tests/ \
            --tb=short -q \
            --cov=. \
            --cov-report=xml:coverage.xml \
            --cov-config=.coveragerc

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fastapi-coverage
          path: fastapi/coverage.xml