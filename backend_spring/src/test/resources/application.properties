# CI test config — H2 in-memory, no real PostgreSQL needed
spring.profiles.active=test

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

spring.flyway.enabled=false

# Placeholders required by Spring Beans during test context loading
# python.base-url=http://localhost:8000
# ollama.base-url=http://localhost:11434
# ollama.model=qwen2.5:3b
# ollama.model.chatbot=qwen2.5:3b

azure.openai.enabled=false
azure.openai.endpoint=http://localhost
azure.openai.key=mock-key
azure.openai.deployment=gpt-4.1-mini

app.storage.audio-dir=./storage/audio
app.storage.video-dir=./storage/videos
app.storage.image-dir=./storage/images

jwt.secret-base64=eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJyaW1hQGRoLmNvbSIsImlhdCI6MTc3MjUzNTEwOCwiZXhwIjoxNzcyNjIxNTA4fQ.1erQkDDLgx7Ezzaz6Lzr138ck5uXQrmVbNN4V59wP9A

# Security/Resource Server mock configurations (prevents Keycloak OIDC discovery during tests)
spring.security.oauth2.resourceserver.jwt.issuer-uri=
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost/mock-jwks

# Keycloak admin mock stubs
keycloak.admin.url=http://localhost
keycloak.admin.realm=talan
keycloak.admin.master-realm=master
keycloak.admin.username=admin
keycloak.admin.password=admin
keycloak.admin.client-id=admin-cli
app.frontend.url=http://localhost:8081

# Mail server mock (prevents connection attempts during tests)
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=mock
spring.mail.password=mock

# Reduce test log verbosity
logging.level.root=WARN
logging.level.com.example=INFO
logging.level.org.springframework.test=WARN
