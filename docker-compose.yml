version: '3.9'

networks:
  speakcoach-net:
    driver: bridge
  sonar-net:
    driver: bridge
  # ── Réseau dédié monitoring (Prometheus, Grafana, Exporters) ────────────────
  monitoring-net:
    driver: bridge


volumes:
  postgres_data:
  spring_storage:
  keycloak_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  sonar_postgres_data:
  # ── Monitoring ──────────────────────────────────────────────────────────────
  prometheus_data:
  grafana_data:

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: speakcoach-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pronunciation_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - speakcoach-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d pronunciation_db" ]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Keycloak ────────────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.3
    container_name: speakcoach-keycloak
    restart: unless-stopped
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_PROXY: edge
      # ✅ Keycloak annonce son issuer avec localhost:8090 (ce que voit le navigateur)
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: "8090"
    command: [ "start-dev", "--import-realm" ]
    ports:
      - "8090:8080"
    volumes:
      - ./backend_spring/keycloak/realm-talan.json:/opt/keycloak/data/import/realm-talan.json
      - keycloak_data:/opt/keycloak/data
    networks:
      - speakcoach-net
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # ── FastAPI (Whisper STT + TTS) ─────────────────────────────────────────────
  fastapi:
    build:
      context: ./fastapi
      dockerfile: Dockerfile
    image: model-train-fastapi
    container_name: speakcoach-fastapi
    restart: unless-stopped
    environment:
      WHISPER_MODEL: small
      CHATBOT_WHISPER_MODEL: small
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
    ports:
      - "8000:8000"
    networks:
      - speakcoach-net
      - monitoring-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── Spring Boot ─────────────────────────────────────────────────────────────
  spring-boot:
    build:
      context: ./backend_spring
      dockerfile: Dockerfile
    image: model-train-spring-boot
    container_name: speakcoach-spring
    restart: unless-stopped
    environment:
      # Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pronunciation_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      # FastAPI
      PYTHON_BASE_URL: http://fastapi:8000

      # Ollama (Qwen 2.5 3B - LOCAL)
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen2.5:3b
      OLLAMA_MODEL_CHATBOT: qwen2.5:3b

      # Azure OpenAI GPT-5.1 (ENABLED - deployment GlobalStandard sur Azure AI Foundry)
      AZURE_OPENAI_ENABLED: "true"
      AZURE_OPENAI_ENDPOINT: https://rima-openai-talannn.services.ai.azure.com
      AZURE_OPENAI_KEY: ${AZURE_OPENAI_KEY}
      AZURE_OPENAI_DEPLOYMENT: gpt-5.1

      # Keycloak — ✅ UNIQUEMENT le JWK URI via réseau Docker interne
      # On supprime ISSUER_URI → plus de validation du claim iss
      # La sécurité est maintenue via la vérification cryptographique de la signature
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/talan/protocol/openid-connect/certs

      # Keycloak Admin via réseau Docker interne
      KEYCLOAK_ADMIN_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_REALM: talan
      KEYCLOAK_ADMIN_CLIENT_ID: talan-frontend
      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD_SPRING}

      # App
      APP_FRONTEND_URL: http://localhost:8081
      APP_STORAGE_AUDIO_DIR: /app/storage/audio
      APP_STORAGE_VIDEO_DIR: /app/storage/videos
      APP_STORAGE_IMAGE_DIR: /app/storage/images

      # ── Actuator / Prometheus monitoring ──────────────────────────────────────
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus,metrics"
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: always
      MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED: "true"

    volumes:
      - spring_storage:/app/storage
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      fastapi:
        condition: service_started
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8080"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - speakcoach-net
      - monitoring-net

  # ── Frontend (React + nginx) ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: model-train-frontend
    container_name: speakcoach-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      spring-boot:
        condition: service_healthy
    networks:
      - speakcoach-net

  # ── pgAdmin ─────────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: speakcoach-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: rima.dhrai@esprit.tn
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - speakcoach-net

  # ── Base de données SonarQube ────────────────────────────────────────────────
  sonar-postgres:
    image: postgres:16-alpine
    container_name: sonar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
    volumes:
      - sonar_postgres_data:/var/lib/postgresql/data
    networks:
      - sonar-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonarqube"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── SonarQube Community Edition ──────────────────────────────────────────────
  sonarqube:
    image: sonarqube:10.6-community
    container_name: sonarqube
    restart: unless-stopped
    depends_on:
      sonar-postgres:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-postgres:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    ports:
      - "9000:9000"
    networks:
      - sonar-net
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/system/status | grep -q UP"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ════════════════════════════════════════════════════════════════════════════
  # MONITORING STACK — Prometheus + Grafana + Exporters
  # ════════════════════════════════════════════════════════════════════════════

  # ── Prometheus — collecte et stockage des métriques ──────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: speakcoach-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - speakcoach-net
      - monitoring-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - spring-boot
      - fastapi
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Grafana — dashboards de visualisation ────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    container_name: speakcoach-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-Admin1234!}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_DOMAIN: localhost
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Pré-installer les plugins utiles (grafana-simple-json-datasource retiré: Angular deprecated)
      GF_INSTALL_PLUGINS: grafana-clock-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3000:3000"
    networks:
      - monitoring-net
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Node Exporter — métriques CPU/RAM du container (compatible Windows/Docker Desktop)
  # NOTE: Sur Windows, le mount /:/host:ro,rslave n'est pas supporté.
  # Node Exporter tourne dans son propre namespace mais expose les métriques
  # du container (utile pour alertes CPU/mémoire au niveau container).
  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: speakcoach-node-exporter
    restart: unless-stopped
    # Pas de --path.rootfs ni de volume / sur Windows (non supporté)
    command:
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.disable-defaults'
      - '--collector.cpu'
      - '--collector.meminfo'
      - '--collector.netdev'
      - '--collector.time'
    ports:
      - "9100:9100"
    networks:
      - monitoring-net

  # ── cAdvisor — métriques des containers Docker (compatible Windows/Docker Desktop)
  # NOTE: Sur Windows, privileged + /dev/kmsg + volumes système Linux ne sont pas supportés.
  # cAdvisor tourne en mode limité mais reste capable de rapporter les métriques
  # CPU/mémoire des containers via l'API Docker socket.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: speakcoach-cadvisor
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "9200:8080"
    networks:
      - monitoring-net

  # ── PostgreSQL Exporter — métriques base de données ──────────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: speakcoach-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/pronunciation_db?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - speakcoach-net
      - monitoring-net
    depends_on:
      postgres:
        condition: service_healthy

