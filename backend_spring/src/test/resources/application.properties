# CI test config — H2 in-memory, no real PostgreSQL needed
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Disable Flyway in tests (PostgreSQL migrations incompatible with H2)
spring.flyway.enabled=false

# Disable Keycloak/OAuth2 in tests
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost/mock-jwks

# Disable mail
spring.mail.host=localhost
spring.mail.port=25

# Reduce test log verbosity
logging.level.root=WARN
logging.level.com.example=INFO
logging.level.org.springframework.test=WARN
