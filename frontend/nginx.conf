server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 500M;
    proxy_read_timeout    300s;
    proxy_connect_timeout  60s;
    proxy_send_timeout    300s;

    # ── SPA routing ────────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Keycloak proxy (/kc → talan-keycloak existant sur host:8090) ──────────
    location /kc/ {
        proxy_pass http://host.docker.internal:8090/;
        proxy_set_header Host               $http_host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-Host   $http_host;
        proxy_set_header X-Forwarded-Port   $server_port;
        proxy_buffer_size          128k;
        proxy_buffers              4 256k;
        proxy_busy_buffers_size    256k;
    }

    # ── FastAPI: audio analyze (direct, no Spring proxy) ──────────────────────
    location = /api/exercises/analyze {
        proxy_pass http://fastapi:8000;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        client_max_body_size 100M;
    }

    # ── FastAPI: misc direct endpoints ────────────────────────────────────────
    location ~ ^/(analyze|phonemes|health|metrics|debug) {
        proxy_pass http://fastapi:8000;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        client_max_body_size 100M;
    }

    location /api/progress {
        proxy_pass http://fastapi:8000;
        proxy_set_header Host $host;
    }
    location /api/history {
        proxy_pass http://fastapi:8000;
        proxy_set_header Host $host;
    }
    location /api/dashboard {
        proxy_pass http://fastapi:8000;
        proxy_set_header Host $host;
    }

    # ── Spring Boot: specific routes (must be before /api/exercises catch-all) ─
    location /api/exercises/progress {
        proxy_pass http://spring-boot:8080;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
    }
    location /api/exercises/generate {
        proxy_pass http://spring-boot:8080;
        proxy_set_header Host            $host;
        proxy_read_timeout 90s;
    }
    location /api/exercises/feedback {
        proxy_pass http://spring-boot:8080;
        proxy_set_header Host            $host;
        proxy_read_timeout 90s;
    }
    location /api/exercises/phrases {
        proxy_pass http://spring-boot:8080;
        proxy_set_header Host            $host;
    }
    location /api/exercises/revision {
        proxy_pass http://spring-boot:8080;
        proxy_set_header Host            $host;
    }

    # ── Spring Boot: SSE endpoints (chatbot voice/text streaming) ────────────
    location ~ ^/api/chat/(voice-sse|text-sse) {
        proxy_pass http://spring-boot:8080;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        client_max_body_size 500M;
        proxy_read_timeout    300s;
        proxy_buffering       off;
        proxy_cache           off;
        add_header            X-Accel-Buffering no;
        chunked_transfer_encoding on;
    }

    # ── Spring Boot: all other /api/* ─────────────────────────────────────────
    location /api/ {
        proxy_pass http://spring-boot:8080;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        client_max_body_size 500M;
        proxy_read_timeout 300s;
    }

    location /auth/ {
        proxy_pass http://spring-boot:8080;
        proxy_set_header Host $host;
    }
    location /uploads/ {
        proxy_pass http://spring-boot:8080;
        proxy_set_header Host $host;
    }
    location /storage/ {
        proxy_pass http://spring-boot:8080;
        proxy_set_header Host $host;
    }
}
